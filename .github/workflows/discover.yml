name: Discover companies
on:
  push:
    paths: ["trigger/discover.txt"]   # a push that changes this file starts a run with its settings
  schedule:
    - cron: "41 1 * * 0"   # Sundays, 01:41 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Archive pages to read per address pattern"
        default: "25"
permissions:
  contents: write
concurrency: radar
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find companies on each applicant-tracking site
        run: |
          PAGES="${{ inputs.max_pages || '25' }}"
          if [ "${{ github.event_name }}" = "push" ]; then read -r PAGES < trigger/discover.txt; fi
          python -m radar.discover --max-pages "$PAGES"
      - name: Save the company lists
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add data/companies
          git diff --cached --quiet || git commit -m "Company lists $(date -u +%F)"
          git pull --rebase
          git push
