name: Radar
on:
  push:
    paths: ["trigger/radar.txt"]   # a push that changes this file starts a run with its settings
  schedule:
    - cron: "17 4 * * *"   # every day, 04:17 UTC
    - cron: "43 15 * * *"  # and 15:43 UTC (a second chance when GitHub skips a scheduled run)
  workflow_dispatch:
    inputs:
      limit:
        description: "Companies per site (0 = all that are due)"
        default: "0"
      budget:
        description: "Minutes per site"
        default: "30"
permissions:
  contents: write
concurrency: radar-run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read job lists and write the report
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: |
          LIMIT="${{ inputs.limit || '0' }}"; BUDGET="${{ inputs.budget || '30' }}"
          if [ "${{ github.event_name }}" = "push" ]; then read -r LIMIT BUDGET < trigger/radar.txt; fi
          python -m radar.run --limit "$LIMIT" --budget-min "$BUDGET"
      - name: Show the report
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: always()
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Radar run $(date -u +%F)"
          git pull --rebase
          git push
